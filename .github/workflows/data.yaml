name: Publish Data (Central Europe, Göttingen, Sylt)

on:
#  workflow_run:
#    workflows: ["Publish Docker images"]
#    branches: [main]
#    types:
#      - completed
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron:  '30 10 14,28 * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  packages: write
  contents: write
  pages: write
  id-token: write

jobs:
  build_central-europe:
    name: Push central-europe Docker image to GitHub Packages
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Free some disk space
        run: |
          df -h
          sudo apt-get update
          sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' '^postgresql-.*' '^gfortran-.*' '^cmake-.*' '^aspnetcore-.*' '^libmono-.*' '^mono-.*' '^ruby.*' '^r-.*' azure-cli  google-chrome-stable firefox powershell
          sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/graalvm/ /usr/local/share/powershell /usr/local/lib/android /usr/local/lib/node_modules /usr/local/.ghcup/ /usr/share/dotnet/ /opt/hostedtoolcache /opt/microsoft /usr/local/aws-*
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          docker rmi -f node:14 node:16 node:18 node:14-alpine node:16-alpine node:18-alpine ubuntu:18.04 ubuntu:20.04 ubuntu:22.04 debian:10 debian:11 buildpack-deps:buster buildpack-deps:bullseye
          df -h

      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Login to GitHub Packages Docker Registry
        uses: docker/login-action@v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.0.0
      - name: Push to GitHub Packages
        uses: docker/build-push-action@v5.0.0
        with:
          push: true
          context: .
          file: deploy/docker/data/Dockerfile
          build-args: |
            MAX_ZOOM=14
            FILTER_BUILDINGS=some
            PLANATILER_IMAGE=ghcr.io/cmahnke/projektemacher-maps/planetiler:latest-data
          tags: |
            ghcr.io/cmahnke/map-data/central-europe:latest

  build_goettingen:
    name: Push goettingen Docker image to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Free some disk space
        run: |
          df -h
          sudo apt-get update
          sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' '^postgresql-.*' '^gfortran-.*' '^cmake-.*' '^aspnetcore-.*' azure-cli  google-chrome-stable firefox powershell
          sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/graalvm/ /usr/local/share/powershell /usr/local/lib/android /usr/local/lib/node_modules /usr/local/.ghcup/ /usr/share/dotnet/
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          docker rmi -f node:14 node:16 node:18 node:14-alpine node:16-alpine node:18-alpine ubuntu:18.04 ubuntu:20.04 ubuntu:22.04 debian:10 debian:11 buildpack-deps:buster buildpack-deps:bullseye
          df -h

      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Login to GitHub Packages Docker Registry
        uses: docker/login-action@v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.0.0
      - name: Push to GitHub Packages
        uses: docker/build-push-action@v5.0.0
        with:
          push: true
          context: .
          file: deploy/docker/data/Dockerfile
          build-args: |
            COVERAGE=goettingen.json
            MAX_ZOOM=15
            EXCLUDE_LAYERS=""
            FILTER_BUILDINGS=false
            TILE_COMPRESSION=none
            KEEP_INPUT=true
            PLANETILER_ARGS="--fetch-wikidata --use_wikidata=true"
          tags: |
            ghcr.io/cmahnke/map-data/goettingen:latest

  build_goettingen_topo:
    name: Push goettingen Topo Docker image to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Login to GitHub Packages Docker Registry
        uses: docker/login-action@v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.0.0
      - name: Push to GitHub Packages
        uses: docker/build-push-action@v5.0.0
        with:
          push: true
          context: .
          file: deploy/docker/data/goettingen-topo/Dockerfile
          tags: |
            ghcr.io/cmahnke/map-data/goettingen:topo

  build_sylt:
    name: Push Sylt Docker image to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Free some disk space
        run: |
          df -h
          sudo apt-get update
          sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' '^postgresql-.*' '^gfortran-.*' '^cmake-.*' azure-cli  google-chrome-stable firefox powershell
          sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/graalvm/ /usr/local/share/powershell /usr/local/lib/android /usr/local/lib/node_modules /usr/local/.ghcup/ /usr/share/dotnet/
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          docker rmi -f node:14 node:16 node:18 node:14-alpine node:16-alpine node:18-alpine ubuntu:18.04 ubuntu:20.04 ubuntu:22.04 debian:10 debian:11 buildpack-deps:buster buildpack-deps:bullseye
          df -h

      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Login to GitHub Packages Docker Registry
        uses: docker/login-action@v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.0.0
      - name: Push to GitHub Packages
        uses: docker/build-push-action@v5.0.0
        with:
          push: true
          context: .
          file: deploy/docker/data/Dockerfile
          build-args: |
            COVERAGE=sylt.json
            MAX_ZOOM=15
            EXCLUDE_LAYERS=""
            FILTER_BUILDINGS=false
            TILE_COMPRESSION=none
          tags: |
            ghcr.io/cmahnke/map-data/sylt:latest

  publish_maps:
    name: Publish generated maps
    needs: [build_goettingen, build_goettingen_topo, build_sylt]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Login to GitHub Packages Docker Registry
        uses: docker/login-action@v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false

      - name: Extract map data from Docker images
        run: |
          mkdir -p public/sylt public/goettingen

          # Extract Sylt
          docker create --name temp_sylt ghcr.io/cmahnke/map-data/sylt:latest
          docker cp temp_sylt:/data/. public/sylt/
          docker rm temp_sylt

          # Extract Göttingen Base
          docker create --name temp_goettingen ghcr.io/cmahnke/map-data/goettingen:latest
          docker cp temp_goettingen:/data/. public/goettingen/
          docker rm temp_goettingen

          # Extract Göttingen Topo into goettingen subfolder
          docker create --name temp_goettingen_topo ghcr.io/cmahnke/map-data/goettingen:topo
          docker cp temp_goettingen_topo:/data/. public/goettingen/
          docker rm temp_goettingen_topo

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
